{% extends "base.html" %}
{% block title %}Buat Akun Admin{% endblock %}
{% block content %}
<div class="card mx-auto mt-4" style="max-width: 460px">
  <div class="card-body p-4">
    <h4 class="mb-1"><i class="bi bi-shield-lock"></i> Buat Akun Admin</h4>
    <p class="text-muted">Belum ada pengguna. Buat akun pertama untuk mengakses aplikasi.</p>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Username *</label><input class="form-control" name="username" value="{{ form.username or '' }}" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label">Nama</label><input class="form-control" name="nama" value="{{ form.nama or '' }}"></div>
      <div class="mb-3"><label class="form-label">Password * <small class="text-muted">(min. 8 karakter)</small></label><input type="password" class="form-control" name="password" minlength="8" autocomplete="new-password" required></div>
      <div class="mb-3"><label class="form-label">Ulangi Password *</label><input type="password" class="form-control" name="konfirmasi" minlength="8" autocomplete="new-password" required></div>
      <button class="btn btn-primary w-100">Buat Akun</button>
    </form>
  </div>
</div>
{% endblock %}
