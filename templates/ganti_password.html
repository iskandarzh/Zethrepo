{% extends "base.html" %}
{% block title %}Ganti Password{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 460px">
  <div class="card-body p-4">
    <h4 class="mb-3">Ganti Password</h4>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Password Lama</label><input type="password" class="form-control" name="password_lama" autocomplete="current-password" required></div>
      <div class="mb-3"><label class="form-label">Password Baru <small class="text-muted">(min. 8 karakter)</small></label><input type="password" class="form-control" name="password" minlength="8" autocomplete="new-password" required></div>
      <div class="mb-3"><label class="form-label">Ulangi Password Baru</label><input type="password" class="form-control" name="konfirmasi" minlength="8" autocomplete="new-password" required></div>
      <div class="d-flex gap-2"><button class="btn btn-primary">Simpan</button><a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Batal</a></div>
    </form>
  </div>
</div>
{% endblock %}
