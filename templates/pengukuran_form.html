{% extends "base.html" %}
{% block title %}Pengukuran{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 720px">
  <div class="card-body">
    <h4 class="mb-1">{{ 'Edit' if edit else 'Input' }} Pengukuran</h4>
    <p class="text-muted">Pasien: <strong>{{ pasien.nama }}</strong></p>
    <form method="post">
      <div class="mb-3"><label class="form-label">Waktu Pengukuran *</label><input type="datetime-local" class="form-control" name="waktu" value="{{ m.waktu or '' }}" required></div>
      <fieldset class="border rounded p-3 mb-3">
        <legend class="float-none w-auto px-2 fs-6"><i class="bi bi-heart-pulse"></i> Tekanan Darah</legend>
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Sistolik (mmHg)</label><input type="number" class="form-control" name="sistolik" value="{{ m.sistolik if m.sistolik is not none else '' }}" placeholder="120"></div>
          <div class="col-md-4"><label class="form-label">Diastolik (mmHg)</label><input type="number" class="form-control" name="diastolik" value="{{ m.diastolik if m.diastolik is not none else '' }}" placeholder="80"></div>
          <div class="col-md-4"><label class="form-label">Nadi (x/menit)</label><input type="number" class="form-control" name="nadi" value="{{ m.nadi if m.nadi is not none else '' }}" placeholder="80"></div>
        </div>
      </fieldset>
      <fieldset class="border rounded p-3 mb-3">
        <legend class="float-none w-auto px-2 fs-6"><i class="bi bi-droplet"></i> Gula Darah</legend>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Kadar (mg/dL)</label><input type="number" class="form-control" name="gula_darah" value="{{ m.gula_darah if m.gula_darah is not none else '' }}" placeholder="110"></div>
          <div class="col-md-6"><label class="form-label">Jenis Pemeriksaan</label>
            <select class="form-select" name="jenis_gula">
              {% for k, v in JENIS_GULA.items() %}<option value="{{ k }}" {% if m.jenis_gula == k %}selected{% endif %}>{{ v }}</option>{% endfor %}
            </select>
          </div>
        </div>
      </fieldset>
      <div class="mb-3"><label class="form-label">Catatan</label><textarea class="form-control" name="catatan" rows="2">{{ m.catatan or '' }}</textarea></div>
      <p class="small text-muted">Isi minimal salah satu: tensi atau gula darah.</p>
      <div class="d-flex gap-2">
        <button class="btn btn-primary">Simpan</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('pasien_detail', pasien_id=pasien.id) }}">Batal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
