{% extends "base.html" %}
{% block title %}Ubah Pengguna{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 520px">
  <div class="card-body p-4">
    <h4 class="mb-3"><i class="bi bi-person-gear"></i> Ubah Pengguna: {{ user.username }}</h4>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Nama lengkap</label><input class="form-control" name="nama" value="{{ user.nama or '' }}"></div>
      <div class="mb-3"><label class="form-label">Peran</label>
        <select class="form-select" name="peran">{% for k, v in c.PERAN.items() %}<option value="{{ k }}" {% if k == user.peran %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="aktif" value="1" id="aktif" {% if user.aktif %}checked{% endif %}><label class="form-check-label" for="aktif">Akun aktif</label></div>
      <hr>
      <p class="small text-muted mb-2">Reset password (kosongkan jika tidak diubah)</p>
      <div class="mb-2"><input type="password" class="form-control" name="password" placeholder="Password baru" minlength="8"></div>
      <div class="mb-3"><input type="password" class="form-control" name="konfirmasi" placeholder="Ulangi password baru" minlength="8"></div>
      <button class="btn btn-primary">Simpan</button>
      <a href="{{ url_for('auth.pengguna') }}" class="btn btn-link">Batal</a>
    </form>
  </div>
</div>
{% endblock %}
