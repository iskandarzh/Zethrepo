{% extends "base.html" %}
{% block title %}Ganti Password{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 460px">
  <div class="card-body p-4">
    <h4 class="mb-3"><i class="bi bi-key"></i> Ganti Password</h4>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Password lama</label><input type="password" class="form-control" name="password_lama" required></div>
      <div class="mb-3"><label class="form-label">Password baru</label><input type="password" class="form-control" name="password" minlength="8" required></div>
      <div class="mb-3"><label class="form-label">Ulangi password baru</label><input type="password" class="form-control" name="konfirmasi" minlength="8" required></div>
      <button class="btn btn-primary">Simpan</button>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-link">Batal</a>
    </form>
  </div>
</div>
{% endblock %}
