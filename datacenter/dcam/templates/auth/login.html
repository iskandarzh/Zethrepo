{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<div class="card mx-auto mt-5" style="max-width: 400px">
  <div class="card-body p-4">
    <div class="text-center mb-3"><i class="bi bi-hdd-rack display-5 text-primary"></i>
      <h4 class="mt-2 mb-0">{{ config.NAMA_DC }}</h4><div class="text-muted small">Activity Management</div></div>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ username }}" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100">Masuk</button>
    </form>
  </div>
</div>
{% endblock %}
